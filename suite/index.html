<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prolianxe CRM">
<meta name="theme-color" content="#08080f">
<title>Prolianxe Business Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500" rel="stylesheet">
<style>
:root {
  --bg:        #08080f;
  --surface:   #111118;
  --surface2:  #1a1a24;
  --surface3:  #22222e;
  --border:    rgba(255,255,255,0.07);
  --border2:   rgba(255,255,255,0.12);
  --text:      #e8e8f0;
  --muted:     #6b6b80;
  --muted2:    #9090a8;
  --accent:    #6366f1;
  --accent-bg: rgba(99,102,241,0.12);
  --accent-glow: rgba(99,102,241,0.25);
  --green:     #22c55e;
  --green-bg:  rgba(34,197,94,0.10);
  --blue:      #3b82f6;
  --blue-bg:   rgba(59,130,246,0.10);
  --red:       #ef4444;
  --red-bg:    rgba(239,68,68,0.10);
  --amber:     #f59e0b;
  --amber-bg:  rgba(245,158,11,0.10);
  --gray-bg:   rgba(148,163,184,0.10);
  --gray:      #94a3b8;
  --radius:    8px;
  --radius-lg: 12px;
  --font-sans: 'Inter', system-ui, sans-serif;
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  height: 100%;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(99,102,241,0.08) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ── PIN GATE ─────────────────────────────────────── */
#pin-gate {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  z-index: 100;
}
.pin-box {
  width: 320px;
  text-align: center;
  animation: fadeUp .4s ease both;
}
.pin-logo {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.5px;
  margin-bottom: 6px;
}
.pin-logo span { color: var(--accent); }
.pin-sub { color: var(--muted); font-size: 13px; margin-bottom: 32px; }
.pin-dots {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 28px;
}
.pin-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid var(--border2);
  background: transparent;
  transition: all .15s;
}
.pin-dot.filled { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
.pin-keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.pin-key {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: all .12s;
  user-select: none;
}
.pin-key:hover { background: var(--surface3); border-color: var(--border2); }
.pin-key:active { transform: scale(.95); }
.pin-key.del { font-size: 14px; color: var(--muted); }
.pin-key.empty { background: transparent; border-color: transparent; cursor: default; }
.pin-key.empty:hover { background: transparent; border-color: transparent; }
.pin-error { color: var(--red); font-size: 12px; margin-top: 12px; min-height: 18px; }

/* ── APP SHELL ────────────────────────────────────── */
#app { display: none; min-height: 100vh; position: relative; z-index: 1; }
#app.visible { display: block; animation: fadeIn .3s ease; }

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(8,8,15,0.92);
  backdrop-filter: blur(12px);
  z-index: 50;
}
.logo {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.3px;
}
.logo span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 16px; }
.header-date { color: var(--muted); font-size: 13px; font-family: var(--font-mono); }
.logout-btn {
  background: none; border: 1px solid var(--border);
  color: var(--muted); padding: 6px 12px; border-radius: var(--radius);
  font-size: 12px; cursor: pointer; transition: all .12s;
}
.logout-btn:hover { border-color: var(--border2); color: var(--text); }

nav {
  display: flex;
  gap: 0;
  padding: 0 28px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.tab-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  padding: 14px 20px;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  margin-bottom: -1px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.tab-btn svg { opacity: .6; }
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-btn.active svg { opacity: 1; }

.tab-content { display: none; padding: 28px; }
.tab-content.active { display: block; animation: fadeIn .2s ease; }

/* ── STAT CARDS ───────────────────────────────────── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  transition: border-color .15s;
}
.stat-card:hover { border-color: var(--border2); }
.stat-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--muted);
  margin-bottom: 10px;
  font-family: var(--font-display);
}
.stat-value {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -1px;
  line-height: 1;
}
.stat-value.positive { color: var(--green); }
.stat-value.negative { color: var(--red); }
.stat-value.accent   { color: var(--accent); }
.stat-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }

/* ── SECTION HEADERS ──────────────────────────────── */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.section-title {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  color: var(--muted2);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.row-count { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }

/* ── FILTER BAR ───────────────────────────────────── */
.filter-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.filter-select, .filter-input {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  padding: 8px 12px;
  font-size: 13px;
  font-family: var(--font-sans);
  outline: none;
  transition: border-color .15s;
}
.filter-select:focus, .filter-input:focus { border-color: var(--accent); }
.filter-input { min-width: 220px; }
.filter-input::placeholder { color: var(--muted); }

/* ── TABLES ───────────────────────────────────────── */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  background: var(--surface);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
thead th {
  background: var(--surface2);
  padding: 11px 14px;
  text-align: left;
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--muted);
  white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
thead th:first-child { border-radius: var(--radius-lg) 0 0 0; }
thead th:last-child { border-radius: 0 var(--radius-lg) 0 0; }
tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,0.03); }
td { padding: 11px 14px; vertical-align: middle; white-space: nowrap; }
.td-mono { font-family: var(--font-mono); font-size: 12px; color: var(--muted2); }
.td-amount {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
  text-align: right;
}
.td-muted { color: var(--muted2); }
tfoot td {
  background: var(--surface2);
  border-top: 1px solid var(--border2);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 12px;
  padding: 10px 14px;
  color: var(--muted2);
}
.empty-row td {
  text-align: center;
  padding: 40px;
  color: var(--muted);
  font-style: italic;
}

/* ── BADGES ───────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-display);
  white-space: nowrap;
}
.badge-paid    { background: var(--green-bg); color: var(--green); }
.badge-sent    { background: var(--blue-bg);  color: var(--blue); }
.badge-draft   { background: var(--gray-bg);  color: var(--gray); }
.badge-overdue { background: var(--red-bg);   color: var(--red); }
.badge-pending { background: var(--amber-bg); color: var(--amber); }
.badge-revolut { background: rgba(99,102,241,0.12); color: var(--accent); font-size: 10px; }
.badge-rd      { background: rgba(139,92,246,.12); color: #a78bfa; }
.badge-ai      { background: rgba(16,185,129,.12);  color: #34d399; }
.badge-banking { background: rgba(59,130,246,.12);  color: #60a5fa; }
.badge-op      { background: rgba(148,163,184,.12); color: #94a3b8; }
.badge-food    { background: rgba(251,146,60,.12);  color: #fb923c; }
.badge-design  { background: rgba(232,121,249,.12); color: #e879f9; }
.badge-acct    { background: rgba(99,102,241,.12);  color: #818cf8; }

/* ── FILE LINK ────────────────────────────────────── */
.file-link {
  color: var(--accent);
  text-decoration: none;
  opacity: .7;
  transition: opacity .12s;
  display: inline-flex;
  align-items: center;
}
.file-link:hover { opacity: 1; }

/* ── RECENT GRID ──────────────────────────────────── */
.recent-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

/* ── LOADING ──────────────────────────────────────── */
.skeleton {
  display: inline-block;
  height: 14px;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--surface2) 25%, var(--surface3) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: translateY(0) } }

/* ── RESPONSIVE ───────────────────────────────────── */
@media (max-width: 768px) {
  header { padding: 14px 16px; }
  nav .tab-btn { padding: 12px 14px; font-size: 12px; }
  .tab-content { padding: 16px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .recent-grid { grid-template-columns: 1fr; }
  .filter-bar { flex-direction: column; }
  .filter-input { min-width: unset; width: 100%; }
}
@media (max-width: 480px) {
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .stat-value { font-size: 20px; }
}
</style>
</head>
<body>

<!-- PIN GATE -->

  <div class="pin-box">

<!-- APP -->
<div id="app">
  <header>
    <div class="logo">Prolianxe <span>Business Suite</span></div>
    <div class="header-right">
      <div class="header-date" id="header-date"></div>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </header>

  <nav>
    <button class="tab-btn active" onclick="showTab('dashboard')" id="tab-dashboard">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Dashboard
    </button>
    <button class="tab-btn" onclick="showTab('invoices')" id="tab-invoices">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
      Invoices
    </button>
    <button class="tab-btn" onclick="showTab('expenses')" id="tab-expenses">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Expenses
    </button>
    <button class="tab-btn" onclick="showTab('clients')" id="tab-clients">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Clients
    </button>

  <!-- DASHBOARD TAB -->
  <div class="tab-content active" id="content-dashboard">

      <div class="stat-card"><div class="stat-label">Revenue YTD</div><div class="stat-value"><span class="skeleton" style="width:100px"></span></div></div>
      <div class="stat-card"><div class="stat-label">Expenses YTD</div><div class="stat-value"><span class="skeleton" style="width:100px"></span></div></div>
      <div class="stat-card"><div class="stat-label">Net P&amp;L</div><div class="stat-value"><span class="skeleton" style="width:80px"></span></div></div>
      <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value"><span class="skeleton" style="width:40px"></span></div></div>
    </div>
    <div class="recent-grid">
      <div>
        <div class="section-header"><div class="section-title">Recent Invoices</div></div>
        <div class="table-wrap" id="recent-invoices-wrap"><div style="padding:20px;color:var(--muted);text-align:center"><span class="skeleton" style="width:200px;height:12px"></span></div></div>
      </div>
      <div>
        <div class="section-header"><div class="section-title">Recent Expenses</div></div>
        <div class="table-wrap" id="recent-expenses-wrap"><div style="padding:20px;color:var(--muted);text-align:center"><span class="skeleton" style="width:200px;height:12px"></span></div></div>
      </div>
    </div>
  </div>

  <!-- INVOICES TAB -->
  <div class="tab-content" id="content-invoices">
    <div class="filter-bar">
      <select class="filter-select" id="inv-status-filter" onchange="renderInvoices()">
        <option value="">All Statuses</option>
        <option value="Draft">Draft</option>
        <option value="Sent">Sent</option>
        <option value="Paid">Paid</option>
        <option value="Overdue">Overdue</option>
      </select>
      <input class="filter-input" type="text" id="inv-search" placeholder="Search invoice # or client…" oninput="renderInvoices()">
    </div>
    <div class="section-header">
      <div class="section-title">Emitted Invoices</div>
      <div class="row-count" id="inv-count"></div>

    <div class="table-wrap" id="invoices-table-wrap"></div>
  </div>

  <!-- EXPENSES TAB -->
  <div class="tab-content" id="content-expenses">
    <div class="filter-bar">
      <select class="filter-select" id="exp-cat-filter" onchange="renderExpenses()">
        <option value="">All Categories</option>
        <option value="R&D">R&amp;D</option>
        <option value="Banking">Banking</option>
        <option value="Operation">Operation</option>
        <option value="Food">Food</option>
        <option value="Graphic Design">Graphic Design</option>
        <option value="A.I.">A.I.</option>
        <option value="Accounting">Accounting</option>
      </select>
      <input class="filter-input" type="text" id="exp-search" placeholder="Search provider or description…" oninput="renderExpenses()">
    </div>
    <div class="section-header">
      <div class="section-title">Expenses</div>
      <div class="row-count" id="exp-count"></div>
    </div>
    <div class="table-wrap" id="expenses-table-wrap"></div>
  </div>

  <!-- CLIENTS TAB -->
  <div class="tab-content" id="content-clients">
    <div class="section-header">
      <div class="section-title">Clients</div>

</div>

<script>
// ── CONFIG ─────────────────────────────────────────────────────────────────
const SB_URL = 'https://mdswkljmmcyyfezckcos.supabase.co'
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kc3drbGptbWN5eWZlemNrY29zIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3OTEzMjI1OCwiZXhwIjoyMDk0NzA4MjU4fQ.GEyugqljU_5zZwP50YmUVgsU2mZUJHx7NWNBrhgWfV0'  // replace with your service_role key
const PIN    = '2626'                        // change this to your preferred PIN
const AUTH_KEY = 'prolianxe_crm_auth'

// ── SUPABASE ────────────────────────────────────────────────────────────────
function sbHeaders() {
  return { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' }
}
async function sbGet(table, params = {}) {
  const url = new URL(`${SB_URL}/rest/v1/${table}`)
  for (const [k,v] of Object.entries(params)) url.searchParams.set(k, v)
  const r = await fetch(url, { headers: sbHeaders() })
  if (!r.ok) throw new Error(`${table}: ${r.status}`)
  return r.json()
}

// ── PIN GATE ────────────────────────────────────────────────────────────────
let pinBuffer = ''
function pinKey(d) {
  if (pinBuffer.length >= 4) return
  pinBuffer += d
  document.getElementById(`d${pinBuffer.length - 1}`).classList.add('filled')
  if (pinBuffer.length === 4) {
    if (pinBuffer === PIN) {
      localStorage.setItem(AUTH_KEY, '1')
      document.getElementById('pin-gate').style.display = 'none'
      boot()
    } else {
      document.getElementById('pin-error').textContent = 'Incorrect PIN'
      setTimeout(() => {
        pinBuffer = ''
        document.querySelectorAll('.pin-dot').forEach(d => d.classList.remove('filled'))
        document.getElementById('pin-error').textContent = ''
      }, 800)
    }
  }
}
function pinDel() {
  if (!pinBuffer.length) return
  pinBuffer = pinBuffer.slice(0, -1)
  document.querySelectorAll('.pin-dot').forEach((d, i) => d.classList.toggle('filled', i < pinBuffer.length))
}
document.addEventListener('keydown', e => {
  if (document.getElementById('pin-gate').style.display === 'none') return
  if (e.key >= '0' && e.key <= '9') pinKey(e.key)
  if (e.key === 'Backspace') pinDel()
})
function logout() { localStorage.removeItem(AUTH_KEY); location.reload() }

// ── STARTUP ─────────────────────────────────────────────────────────────────
if (localStorage.getItem(AUTH_KEY)) {
  document.getElementById('pin-gate').style.display = 'none'
  boot()
}

// ── DATA ─────────────────────────────────────────────────────────────────────
let DATA = { invoices: [], expenses: [], clients: [], providers: [], entities: [] }

async function boot() {
  const app = document.getElementById('app')
  app.classList.add('visible')
  document.getElementById('header-date').textContent = new Date().toLocaleDateString('en-GB', {weekday:'short',year:'numeric',month:'short',day:'numeric'})
  try {
    const [invoices, expenses, clients, providers, entities] = await Promise.all([
      sbGet('emitted_invoices', { select: '*', order: 'date.desc', limit: '500' }),
      sbGet('expenses',         { select: '*', order: 'date.desc', limit: '500' }),
      sbGet('clients',          { select: '*', order: 'name.asc', limit: '200' }),
      sbGet('providers',        { select: '*', order: 'name.asc', limit: '200' }),
      sbGet('entities',         { select: '*' }),
    ])
    DATA = { invoices, expenses, clients, providers, entities }
    renderDashboard()
    renderInvoices()
    renderExpenses()
    renderClients()
  } catch(e) {
    console.error(e)
    document.getElementById('stats-grid').innerHTML = `<div style="grid-column:1/-1;color:var(--red);padding:20px">Failed to load data. Check SB_KEY in index.html.<br><small>${e.message}</small></div>`
  }
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
const eur = v => v == null ? '—' : new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 2 }).format(v)
const usd = v => v == null ? '—' : new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 }).format(v)
const fdate = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-GB') : '—'

function clientName(id) {
  const c = DATA.clients.find(c => c.id === id)
  return c ? c.name : '—'
}
function providerName(id) {
  const p = DATA.providers.find(p => p.id === id)
  return p ? p.name : '—'
}
function entityInfo(id) {
  return DATA.entities.find(e => e.id === id) || { name: 'Prolianxe', brand_color: '#6366f1' }
}

function statusBadge(s) {
  const map = { Paid: 'paid', Sent: 'sent', Draft: 'draft', Overdue: 'overdue', Pending: 'pending' }
  return `<span class="badge badge-${map[s] || 'draft'}">${s || '—'}</span>`
}
function catBadge(c) {
  const map = { 'R&D': 'rd', 'A.I.': 'ai', 'Banking': 'banking', 'Operation': 'op', 'Food': 'food', 'Graphic Design': 'design', 'Accounting': 'acct' }
  return `<span class="badge badge-${map[c] || 'op'}">${c || '—'}</span>`
}
function entityBadge(entityId) {
  const e = entityInfo(entityId)
  return `<span class="badge" style="background:${e.brand_color}22;color:${e.brand_color}">${e.name}</span>`
}
function fileLink(url) {
  if (!url) return '—'
  return `<a class="file-link" href="${url}" target="_blank" title="View file">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
      <polyline points="15,3 21,3 21,9"/><line x1="10" y1="14" x2="21" y2="3"/>
    </svg>
  </a>`
}

// ── DASHBOARD ────────────────────────────────────────────────────────────────
function renderDashboard() {
  const year = new Date().getFullYear().toString()
  const revenueYTD = DATA.invoices
    .filter(i => i.status === 'Paid' && i.date?.startsWith(year))
    .reduce((s, i) => s + (i.eur_amount || 0), 0)
  const expensesYTD = DATA.expenses
    .filter(e => e.date?.startsWith(year))
    .reduce((s, e) => s + (e.eur_equivalent || 0), 0)
  const pl = revenueYTD - expensesYTD
  const pending = DATA.invoices.filter(i => i.status === 'Sent' || i.status === 'Overdue').length

  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Revenue YTD</div>
      <div class="stat-value">${eur(revenueYTD)}</div>
      <div class="stat-sub">Paid invoices ${year}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Expenses YTD</div>
      <div class="stat-value">${eur(expensesYTD)}</div>
      <div class="stat-sub">Total costs ${year}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Net P&amp;L</div>
      <div class="stat-value ${pl >= 0 ? 'positive' : 'negative'}">${eur(pl)}</div>
      <div class="stat-sub">${pl >= 0 ? 'Profitable' : 'Loss'} ${year}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Pending</div>
      <div class="stat-value accent">${pending}</div>
      <div class="stat-sub">Awaiting payment</div>
    </div>
  `

  // Recent invoices
  const recentInv = DATA.invoices.slice(0, 5)
  document.getElementById('recent-invoices-wrap').innerHTML = `
    <table><thead><tr>
      <th>Invoice #</th><th>Client</th><th>Date</th><th style="text-align:right">Amount</th><th>Status</th>
    </tr></thead><tbody>
    ${recentInv.length ? recentInv.map(i => `<tr>
      <td class="td-mono">${i.invoice_number}</td>
      <td>${clientName(i.client_id)}</td>
      <td class="td-muted">${fdate(i.date)}</td>
      <td class="td-amount">${eur(i.eur_amount)}</td>
      <td>${statusBadge(i.status)}</td>
    </tr>`).join('') : '<tr class="empty-row"><td colspan="5">No invoices</td></tr>'}
    </tbody></table>`

  // Recent expenses
  const recentExp = DATA.expenses.slice(0, 5)
  document.getElementById('recent-expenses-wrap').innerHTML = `
    <table><thead><tr>
      <th>Date</th><th>Provider</th><th>Category</th><th style="text-align:right">EUR</th>
    </tr></thead><tbody>
    ${recentExp.length ? recentExp.map(e => `<tr>
      <td class="td-muted">${fdate(e.date)}</td>
      <td>${providerName(e.provider_id)}</td>
      <td>${catBadge(e.category)}</td>
      <td class="td-amount">${eur(e.eur_equivalent)}</td>
    </tr>`).join('') : '<tr class="empty-row"><td colspan="4">No expenses</td></tr>'}
    </tbody></table>`
}

// ── INVOICES ─────────────────────────────────────────────────────────────────
function renderInvoices() {
  const status = document.getElementById('inv-status-filter').value
  const q = document.getElementById('inv-search').value.toLowerCase()
  let rows = DATA.invoices.filter(i => {
    if (status && i.status !== status) return false
    if (q && !i.invoice_number?.toLowerCase().includes(q) && !clientName(i.client_id).toLowerCase().includes(q)) return false
    return true
  })
  document.getElementById('inv-count').textContent = `${rows.length} records`
  document.getElementById('invoices-table-wrap').innerHTML = `
    <table><thead><tr>
      <th>Invoice #</th><th>Client</th><th>Date</th>
      <th style="text-align:right">EUR</th><th style="text-align:right">USD</th>
      <th>Due Date</th><th>Status</th><th>File</th>
    </tr></thead><tbody>
    ${rows.length ? rows.map(i => `<tr>
      <td class="td-mono">${i.invoice_number}</td>
      <td>${clientName(i.client_id)}</td>
      <td class="td-muted">${fdate(i.date)}</td>
      <td class="td-amount">${eur(i.eur_amount)}</td>
      <td class="td-amount td-muted">${usd(i.usd_amount)}</td>
      <td class="td-muted">${fdate(i.due_date)}</td>
      <td>${statusBadge(i.status)}</td>
      <td>${fileLink(i.file_url)}</td>
    </tr>`).join('') : '<tr class="empty-row"><td colspan="8">No invoices match filter</td></tr>'}
    </tbody></table>`
}

// ── EXPENSES ─────────────────────────────────────────────────────────────────
function renderExpenses() {
  const cat = document.getElementById('exp-cat-filter').value
  const q = document.getElementById('exp-search').value.toLowerCase()
  let rows = DATA.expenses.filter(e => {
    if (cat && e.category !== cat) return false
    if (q && !providerName(e.provider_id).toLowerCase().includes(q) && !e.description?.toLowerCase().includes(q) && !e.invoice_number?.toLowerCase().includes(q)) return false
    return true
  })
  const total = rows.reduce((s, e) => s + (e.eur_equivalent || 0), 0)
  document.getElementById('exp-count').textContent = `${rows.length} records`
  document.getElementById('expenses-table-wrap').innerHTML = `
    <table><thead><tr>
      <th>Date</th><th>Invoice #</th><th>Provider</th><th>Category</th>
      <th style="text-align:right">Net</th><th style="text-align:right">EUR Equiv</th>
      <th>Status</th><th>Tags</th><th>File</th>
    </tr></thead><tbody>
    ${rows.length ? rows.map(e => `<tr>
      <td class="td-muted">${fdate(e.date)}</td>
      <td class="td-mono">${e.invoice_number || '—'}</td>
      <td>${providerName(e.provider_id)}</td>
      <td>${catBadge(e.category)}</td>
      <td class="td-amount td-muted">${eur(e.net)}</td>
      <td class="td-amount">${eur(e.eur_equivalent)}</td>
      <td>${statusBadge(e.status)}</td>
      <td>${e.is_revolut ? '<span class="badge badge-revolut">Revolut</span>' : ''}</td>
      <td>${fileLink(e.file_url)}</td>
    </tr>`).join('') : '<tr class="empty-row"><td colspan="9">No expenses match filter</td></tr>'}
    </tbody>
    <tfoot><tr>
      <td colspan="5" style="color:var(--muted)">Total (filtered)</td>
      <td class="td-amount" style="color:var(--text)">${eur(total)}</td>
      <td colspan="3"></td>
    </tr></tfoot>
    </table>`
}

// ── CLIENTS ──────────────────────────────────────────────────────────────────
function renderClients() {
  const rows = DATA.clients
  document.getElementById('clients-count').textContent = `${rows.length} clients`
  document.getElementById('clients-table-wrap').innerHTML = `
    <table><thead><tr>
      <th>Name</th><th>Entity</th><th>Country</th><th>Email</th>
    </tr></thead><tbody>
    ${rows.length ? rows.map(c => `<tr>
      <td style="font-weight:500">${c.name}</td>
      <td>${entityBadge(c.entity_id)}</td>
      <td class="td-muted">${c.country || '—'}</td>
      <td class="td-muted">${c.email || '—'}</td>
    </tr>`).join('') : '<tr class="empty-row"><td colspan="4">No clients</td></tr>'}
    </tbody></table>`
}

// ── TAB NAV ───────────────────────────────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'))
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'))
  document.getElementById('tab-' + name).classList.add('active')
  document.getElementById('content-' + name).classList.add('active')
}
</script>
</body>
</html>
